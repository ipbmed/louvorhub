project_id = "louvorhub"

[api]
enabled = true

[db]
major_version = 15

[auth]
enabled = true
# `npx supabase config push` envia estes valores para o projeto remoto: mantenha-os iguais à produção.
# URLs fora de additional_redirect_urls são ignoradas no link do e-mail e o Supabase usa site_url.
site_url = "https://ipblouvorhub.vercel.app"
additional_redirect_urls = []

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "[LouvorHub] Código de acesso"
content_path = "./supabase/templates/magic_link.html"

[functions.create-member]
verify_jwt = true

[functions.register-account]
verify_jwt = false

[functions.assistant]
verify_jwt = true
