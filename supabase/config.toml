project_id = "louvorhub"

[api]
enabled = true

[db]
major_version = 15

[auth]
enabled = true
# Em produção, defina site_url com o domínio público e inclua-o em additional_redirect_urls.
# URLs fora desta lista são ignoradas no magic link e o Supabase usa site_url como destino.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
  "http://localhost:4173/**",
  "https://*.github.io/**",
]

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.create-member]
verify_jwt = true

[functions.register-account]
verify_jwt = false
